<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">False ceiling contractor comparison checklist</title><desc id="desc">Four illustrative steps for comparing a false ceiling quote: room measurements, system details, fixture coordination and finish handover.</desc>
<rect width="1200" height="640" rx="28" fill="#faf9f8"/><text x="64" y="74" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#e85555">QUOTE COMPARISON CHECKLIST</text><text x="64" y="128" font-family="Georgia,serif" font-size="43" font-weight="700" fill="#111">Use one measured scope for every contractor</text>
<path d="M160 355H1030" stroke="#e7c6c0" stroke-width="5" stroke-dasharray="12 12"/>
<g font-family="Arial,sans-serif"><g transform="translate(70 190)"><rect width="240" height="300" rx="24" fill="#fff" stroke="#eee4e1" stroke-width="2"/><circle cx="120" cy="94" r="48" fill="#fff0ed"/><path d="M86 88h68M86 108h48M86 128h58" stroke="#e85555" stroke-width="7" stroke-linecap="round"/><text x="24" y="190" font-size="18" font-weight="700" fill="#e85555">01 · MEASURE</text><text x="24" y="224" font-size="20" font-weight="700" fill="#111">Room and zones</text><text x="24" y="258" font-size="16" fill="#666">Area, beams, levels, edges</text></g>
<g transform="translate(360 190)"><rect width="240" height="300" rx="24" fill="#fff" stroke="#eee4e1" stroke-width="2"/><circle cx="120" cy="94" r="48" fill="#fff0ed"/><path d="M83 79h74v45H83zM96 66v13M144 66v13M96 124v13M144 124v-13" fill="none" stroke="#e85555" stroke-width="6"/><text x="24" y="190" font-size="18" font-weight="700" fill="#e85555">02 · SPECIFY</text><text x="24" y="224" font-size="20" font-weight="700" fill="#111">System and finish</text><text x="24" y="258" font-size="16" fill="#666">Board, panel, joint, edge</text></g>
<g transform="translate(650 190)"><rect width="240" height="300" rx="24" fill="#fff" stroke="#eee4e1" stroke-width="2"/><circle cx="120" cy="94" r="48" fill="#fff0ed"/><circle cx="120" cy="94" r="22" fill="none" stroke="#e85555" stroke-width="6"/><path d="M120 59v16M120 113v16M85 94h16M139 94h16" stroke="#e85555" stroke-width="5"/><text x="24" y="190" font-size="18" font-weight="700" fill="#e85555">03 · COORDINATE</text><text x="24" y="224" font-size="20" font-weight="700" fill="#111">Lights and access</text><text x="24" y="258" font-size="16" fill="#666">Cut-outs, wiring, drivers</text></g>
<g transform="translate(940 190)"><rect width="240" height="300" rx="24" fill="#fff" stroke="#eee4e1" stroke-width="2"/><circle cx="120" cy="94" r="48" fill="#fff0ed"/><path d="M93 96l18 18 36-42" fill="none" stroke="#e85555" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="190" font-size="18" font-weight="700" fill="#e85555">04 · HAND OVER</text><text x="24" y="224" font-size="20" font-weight="700" fill="#111">Finish and exclusions</text><text x="24" y="258" font-size="16" fill="#666">Paint, cleanup, service</text></g></g>
<text x="600" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#777">Original illustrative checklist — not a completed Arsh Interiors project.</text></svg>