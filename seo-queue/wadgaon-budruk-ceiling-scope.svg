<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Ceiling scope comparison</title><desc id="d">Illustrative choices for a smooth ceiling, decorative POP border and panel or grid area.</desc><rect width="1200" height="640" rx="28" fill="#faf9f8"/><text x="60" y="76" font-family="Arial" font-size="22" font-weight="700" fill="#e85555">SCOPE BEFORE STYLE</text><text x="60" y="130" font-family="Georgia" font-size="42" font-weight="700" fill="#111">Separate the system from the detail</text><rect x="70" y="185" width="690" height="350" rx="24" fill="white" stroke="#d9d2ce" stroke-width="3"/><rect x="115" y="230" width="600" height="258" rx="24" fill="white" stroke="#e85555" stroke-width="7"/><path d="M155 270h520M155 448h520" stroke="#f0d3ce" stroke-width="3" stroke-dasharray="10 8"/><circle cx="415" cy="356" r="33" fill="#fff0ed" stroke="#e85555" stroke-width="4"/><circle cx="415" cy="356" r="10" fill="#ff6b6b"/><g font-family="Arial"><g transform="translate(810 188)"><rect width="320" height="102" rx="18" fill="white" stroke="#eee4e1" stroke-width="2"/><circle cx="50" cy="51" r="20" fill="#ff6b6b"/><text x="88" y="46" font-size="20" font-weight="700">Main system</text><text x="88" y="74" font-size="15" fill="#666">Gypsum • PVC • grid</text><rect y="120" width="320" height="102" rx="18" fill="white" stroke="#eee4e1" stroke-width="2"/><circle cx="50" cy="171" r="20" fill="#ff6b6b"/><text x="88" y="166" font-size="20" font-weight="700">POP detail</text><text x="88" y="194" font-size="15" fill="#666">Border • cove • moulding</text><rect y="240" width="320" height="102" rx="18" fill="white" stroke="#eee4e1" stroke-width="2"/><circle cx="50" cy="291" r="20" fill="#ff6b6b"/><text x="88" y="286" font-size="20" font-weight="700">Written scope</text><text x="88" y="314" font-size="15" fill="#666">Measure • finish • access</text></g></g><text x="600" y="600" text-anchor="middle" font-family="Arial" font-size="15" fill="#77