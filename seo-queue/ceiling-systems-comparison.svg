<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d">
<title id="t">Four ceiling system planning sketches</title>
<desc id="d">Illustrative comparison of gypsum board, POP detail, PVC panel and modular grid ceiling construction options.</desc>
<rect width="1000" height="560" rx="28" fill="#faf9f8"/>
<text x="54" y="66" fill="#111" font-family="Arial,sans-serif" font-size="30" font-weight="700">Ceiling systems: compare the complete plan</text>
<text x="54" y="102" fill="#555" font-family="Arial,sans-serif" font-size="17">Illustrative sections only — confirm product and site details with the installer.</text>
<g transform="translate(50 142)">
<rect width="430" height="165" rx="18" fill="#fff" stroke="#eadfdb" stroke-width="3"/>
<text x="24" y="38" fill="#e85555" font-family="Arial" font-size="20" font-weight="700">GYPSUM BOARD</text>
<path d="M34 100H396" stroke="#111" stroke-width="6"/><path d="M34 119H396" stroke="#ff6b6b" stroke-width="13"/>
<path d="M130 119v-19m170 19v-19" stroke="#b7a8a3" stroke-width="3" stroke-dasharray="5 5"/>
<text x="34" y="150" fill="#555" font-family="Arial" font-size="14">Frame • board joints • light openings</text>
</g>
<g transform="translate(520 142)">
