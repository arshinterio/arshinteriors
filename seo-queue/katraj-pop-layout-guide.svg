<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">POP ceiling layout and profile scale</title><desc id="d">Measured POP border and central fixture layout with corner and cove review notes.</desc><rect width="1200" height="640" rx="28" fill="#faf9f8"/><text x="60" y="76" font-family="Arial" font-size="22" font-weight="700" fill="#e85555">POP CEILING DESIGN CHECK</text><text x="60" y="130" font-family="Georgia" font-size="42" font-weight="700" fill="#111">Keep the profile in proportion to the room</text><rect x="78" y="180" width="700" height="370" rx="28" fill="white" stroke="#d9d2ce" stroke-width="3"/><rect x="115" y="217" width="626" height="296" rx="36" fill="#fff8f6" stroke="#ff6b6b" stroke-width="10"/><rect x="190" y="260" width="476" height="210" rx="28" fill="white" stroke="#e9c5bd" stroke-width="3" stroke-dasharray="8 8"/><circle cx="428" cy="365" r="42" fill="#fff0ed" stroke="#e85555" stroke-width="4"/><circle cx="428" cy="365" r="12" fill="#ff6b6b"/><text x="428" y="438" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">CENTRAL FIXTURE</text><text x="428" y="232" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#c94f4f">MEASURED POP BORDER</text><rect x="820" y="180" width="310" height="370" rx="22" fill="white" stroke="#eee4e1" stroke-width="2"/><text x="854" y="230" font-family="Arial" font-size="22" font-weight="700">Review</text><g font-family="Arial" font-size="17" fill="#555"><text x="854" y="282">• Profile width</text><text x="854" y="328">• Corner returns</text><text x="854" y="374">• Cove section</text><text x="854" y="420">• Light cut-outs</text><text x="854" y="466">• Paint edge</text></g><text x="600" y="600" text-anchor="middle" font-family="Arial" font-size="15" fill="#777">Original illustration only — not a completed Arsh Interiors project.</text></svg>