<rect x="445" y="305" width="50" height="52" rx="8" fill="#eee8e3" stroke="#c9c1ba" stroke-width="2"/>
<rect x="112" y="245" width="34" height="34" rx="6" fill="#ffe7e1" stroke="#e85555" stroke-width="3"/>
<text x="119" y="269" fill="#b83232" font-family="Arial,sans-serif" font-size="16" font-weight="700">SW</text>
<circle cx="180" cy="375" r="18" fill="#e85555"/><text x="174" y="382" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">S</text>
<circle cx="470" cy="375" r="18" fill="#e85555"/><text x="464" y="382" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">S</text>
<rect x="305" y="512" width="120" height="20" rx="6" fill="#ded7d1"/>
<text x="330" y="547" fill="#5d5d5d" font-family="Arial,sans-serif" font-size="16">TV / desk wall</text>
<!-- Living room card -->
<rect x="622" y="145" width="530" height="490" rx="22" fill="#fff" stroke="#ddd5cf" stroke-width="3"/>
