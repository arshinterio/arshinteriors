<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Illustrative bedroom and living-room switch and socket plan</title>
<desc id="desc">A top-down planning diagram showing a bedroom bed, living-room sofa and television, with example switch and socket points marked on the walls. It is an illustration, not an installation drawing.</desc>
<rect width="1200" height="760" rx="28" fill="#f7f5f2"/>
<text x="60" y="70" fill="#171717" font-family="Arial,sans-serif" font-size="34" font-weight="700">Plan points around furniture</text>
<text x="60" y="108" fill="#5d5d5d" font-family="Arial,sans-serif" font-size="18">Illustrative only · confirm final positions with your electrician</text>
<!-- Bedroom card -->
<rect x="48" y="145" width="530" height="490" rx="22" fill="#fff" stroke="#ddd5cf" stroke-width="3"/>
<text x="78" y="190" fill="#171717" font-family="Arial,sans-serif" font-size="25" font-weight="700">Bedroom</text>
<rect x="90" y="225" width="440" height="330" rx="8" fill="#faf9f8" stroke="#8f9699" stroke-width="8"/>
<path d="M90 460 L90 555 L185 555" fill="none" stroke="#faf9f8" stroke-width="12"/>
<path d="M90 460 A95 95 0 0 1 185 555" fill="none" stroke="#8f9699" stroke-width="3"/>
<rect x="220" y="285" width="210" height="190" rx="14" fill="#e8e3de" stroke="#b8b0a8" stroke-width="3"/>
