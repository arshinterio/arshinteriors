<text x="760" y="520" fill="#5d5d5d" font-family="Arial,sans-serif" font-size="16">Seating and lamp points</text>
<!-- legend -->
<circle cx="75" cy="690" r="15" fill="#e85555"/><text x="70" y="696" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">S</text>
<text x="102" y="697" fill="#333" font-family="Arial,sans-serif" font-size="18">Example socket point</text>
<rect x="370" y="675" width="30" height="30" rx="5" fill="#ffe7e1" stroke="#e85555" stroke-width="3"/>
<text x="375" y="696" fill="#b83232" font-family="Arial,sans-serif" font-size="13" font-weight="700">SW</text>
<text x="414" y="697" fill="#333" font-family="Arial,sans-serif" font-size="18">Example switchboard</text>
<text x="690" y="697" fill="#5d5d5d" font-family="Arial,sans-serif" font-size="17">Map actual furniture and appliance needs first.</text>
