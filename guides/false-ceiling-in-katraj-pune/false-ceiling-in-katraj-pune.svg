<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">Gypsum ceiling planning diagram</title><desc id="desc">A room plan shows fan centre, lighting positions and notes to check finished ceiling height.</desc><rect width="960" height="520" rx="28" fill="#faf9f8"/><text x="58" y="70" fill="#111" font-family="Arial,sans-serif" font-size="28" font-weight="700">Plan the room before the gypsum ceiling</text><rect x="75" y="112" width="520" height="320" rx="10" fill="#fff" stroke="#d9d2ce" stroke-width="5"/><path d="M95 140h480v265H95z" fill="none" stroke="#ff6b6b" stroke-width="10" stroke-dasharray="16 10"/><circle cx="335" cy="275" r="19" fill="#ff6b6b"/><path d="M335 228v94M288 275h94M302 242l66 66M368 242l-66 66" stroke="#111" stroke-width="4" stroke-linecap="round"/><circle cx="168" cy="190" r="12" fill="#e85555"/><circle cx="500" cy="190" r="12" fill="#e85555"/><circle cx="168" cy="360" r="12" fill="#e85555"/><circle cx="500" cy="360" r="12" fill="#e85555"/><text x="652" y="155" fill="#e85555" font-family="Arial,sans-serif" font-size="21" font-weight="700">CHECK ON ONE DRAWING</text><text x="652" y="204" fill="#111" font-family="Arial,sans-serif" font-size="20">Fan centre</text><text x="652" y="247" fill="#111" font-family="Arial,sans-serif" font-size="20">Light positions</text><text x="652" y="290" fill="#111" font-family="Arial,sans-serif" font-size="20">Cove / edge detail</text><text x="652" y="333" fill="#111" font-family="Arial,sans-serif" font-size="20">Finished clear height</text><rect x="650" y="366" width="250" height="44" rx="12" fill="#ffe7e1"/><text x="669" y="395" fill="#111" font-family="Arial,sans-serif" font-size="16" font-weight="700">Illustrative planning visual</text></svg>