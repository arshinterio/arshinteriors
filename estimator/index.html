    <style>
        :root {
            --primary: #ff6b6b;
            --primary-dark: #e85555;
            --dark: #111111;
            --light: #faf9f8;
            --gray: #666666;
            --border: #f0d5d5;
            --card-bg: #ffffff;
            --transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding-top: 85px;
            overflow-x: hidden;
            line-height: 1.8;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 15px;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeInUp 0.5s ease forwards; }

        /* Fixed Mobile-Optimized Header */
        .site-header {
            position: fixed; top: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); z-index: 9999; box-shadow: 0 2px 15px rgba(0,0,0,0.06);
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; max-width: 1200px; margin: 0 auto;
        }
        .logo { color: var(--dark); text-decoration: none; font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .round-call-btn {
            background: var(--primary); color: #fff; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; text-decoration: none; box-shadow: 0 4px 12px rgba(255,107,107,0.3); transition: var(--transition); flex-shrink: 0;
        }
        .hamburger-btn {
            background: #f0f0f0; color: var(--dark); width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; border: none; transition: var(--transition); flex-shrink: 0;
        }

        /* Mobile Slide-out Drawer */
        .mobile-drawer {
            position: fixed; top: 0; right: -100%; width: 280px; height: 100vh; background: #fff; z-index: 10000; box-shadow: -5px 0 30px rgba(0,0,0,0.15); transition: var(--transition); padding: 30px 20px; display: flex; flex-direction: column; box-sizing: border-box;
        }
        .mobile-drawer.open { right: 0; }
        .drawer-close { font-size: 1.5rem; background: none; border: none; align-self: flex-end; cursor: pointer; margin-bottom: 20px; color: var(--dark); }
        .drawer-links { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 18px; }
        .drawer-links a { font-size: 1.1rem; font-weight: 700; color: var(--dark); text-decoration: none; transition: var(--transition); }
        .drawer-links a:hover, .drawer-links a.active { color: var(--primary); }

        /* Highlighted Estimator Card Container */
        .estimator-card {
            background: linear-gradient(135deg, #ffffff 0%, #fff8f8 100%); 
            border-radius: 20px; 
            box-shadow: 0 12px 35px rgba(255,107,107,0.08); 
            padding: 30px 18px; 
            border: 2px solid #ffdcdc; 
            margin: 15px 0 40px; 
            transition: var(--transition);
        }
        
        .calc-heading {
            font-size: clamp(1.6rem, 3vw, 2.2rem); 
            color: var(--dark); 
            margin-top: 0; 
            margin-bottom: 22px; 
            text-align: center; 
            border-bottom: 2px solid #ffdcdc; 
            padding-bottom: 12px; 
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 700;
        }
        .calc-heading span { color: var(--primary); }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.9rem; color: #222; }
        select, input[type="text"], input[type="tel"], input[type="number"], textarea {
            width: 100%; padding: 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.95rem; font-family: inherit; background: #fff; transition: var(--transition); box-sizing: border-box;
        }
        select:focus, input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,107,107,0.1); }
        
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .checkbox-card {
            border: 2px solid var(--border); border-radius: 12px; padding: 15px 10px; text-align: center; cursor: pointer; transition: var(--transition); background: #fff;
        }
        .checkbox-card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .checkbox-card.selected {
            border-color: var(--primary); background: rgba(255,107,107,0.06); color: var(--primary); box-shadow: 0 5px 15px rgba(255,107,107,0.1);
        }
        .checkbox-card i { font-size: 1.5rem; margin-bottom: 6px; display: block; color: var(--gray); }
        .checkbox-card.selected i { color: var(--primary); }
        .checkbox-card strong { font-size: 0.9rem; display: block; }

        /* Button Fixed to Prevent Text Cutting / Stretching */
        .btn {
            background: var(--primary); 
            color: #fff; 
            padding: 15px 20px; 
            border: none; 
            border-radius: 10px; 
            font-size: 1rem; 
            font-weight: 700; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 20px; 
            transition: var(--transition); 
            text-align: center; 
            text-decoration: none; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            box-shadow: 0 6px 15px rgba(255,107,107,0.25);
            box-sizing: border-box;
            word-break: normal;
            white-space: normal;
        }
        .btn:hover { background: var(--primary-dark); }
        .hidden { display: none !important; }

        @media (min-width: 768px) {
            .estimator-card { padding: 45px; }
            .grid-options { grid-template-columns: repeat(4, 1fr); }
            .round-call-btn { display: none; }
            .hamburger-btn { display: none; }
            .desktop-nav { display: flex !important; gap: 20px; align-items: center; }
            .desktop-nav a { color: #555; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
            .desktop-nav a:hover, .desktop-nav a.active { color: var(--primary); }
            .btn { font-size: 1.05rem; padding: 15px 30px; }
        }
        @media (max-width: 767px) {
            .desktop-nav { display: none; }
        }

<body>

    <!-- Fixed Header -->
    

    <!-- Mobile Slide-out Drawer -->
    

    

    <main>
        <!-- Estimator Card Section -->
        <section class="container animate-fade">
            <div class="estimator-card">
                <form id="proEstimatorForm">
                    
                    <!-- STEP 1 -->
                    <div id="step-1">
                        <h2 class="calc-heading">Interior <span>Cost Calculator</span></h2>
                        <div class="form-group">
                            <label for="propType">Select Property Type *</label>
                            <select id="propType" required>
                                <option value="">-- Choose Property Type --</option>
                                <option value="1 BHK">1 BHK Apartment</option>
                                <option value="2 BHK">2 BHK Apartment</option>
                                <option value="3 BHK">3 BHK Apartment</option>
                                <option value="4+ BHK">4+ BHK / Duplex</option>
                                <option value="Bungalow">Bungalow / Villa</option>
                                <option value="Commercial">Commercial / Shop</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="carpetArea">Enter Carpet Area (Sq. Ft) *</label>
                            <input type="number" id="carpetArea" required placeholder="e.g., 850 (approx carpet area)">
                        </div>

                        <div class="form-group">
                            <label for="timeline">Project Timeline *</label>
                            <select id="timeline" required>
                                <option value="">-- Choose Timeline --</option>
                                <option value="In a week">In a week</option>
                                <option value="In a month">In a month</option>
                                <option value="Just exploring">Just exploring</option>
                            </select>
                        </div>

                        <button type="button" class="btn" onclick="goToStep(2)"><span>Next: Select Services & Quality</span> <i class="fas fa-arrow-right"></i></button>
                    </div>

                    <!-- STEP 2 -->
                    <div id="step-2" class="hidden">
                        <h2 class="calc-heading">Choose Services & <span>Quality Grade</span></h2>
                        <div class="form-group">
                            <label>Select Services Required * (Multiple Choice)</label>
                            <div class="grid-options" style="margin-top: 10px;">
                                <div class="checkbox-card" onclick="toggleService(this, 'ceiling')">
                                    <i class="fas fa-layer-group"></i>
                                    <strong>False Ceiling</strong>
                                    <input type="checkbox" name="service" value="False Ceiling" class="hidden">
                                </div>
                                <div class="checkbox-card" onclick="toggleService(this, 'electrical')">
                                    <i class="fas fa-bolt"></i>
                                    <strong>Electrical Work</strong>
                                    <input type="checkbox" name="service" value="Electrical" class="hidden">
                                </div>
                                <div class="checkbox-card" onclick="toggleService(this, 'painting')">
                                    <i class="fas fa-paint-roller"></i>
                                    <strong>Painting</strong>
                                    <input type="checkbox" name="service" value="Painting" class="hidden">
                                </div>
                                <div class="checkbox-card" onclick="toggleService(this, 'furniture')">
                                    <i class="fas fa-couch"></i>
                                    <strong>Furniture</strong>
                                    <input type="checkbox" name="service" value="Furniture" class="hidden">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="otherService">Other Services / Special Requirements (Optional)</label>
                            <textarea id="otherService" rows="2" placeholder="Mention custom requirements..."></textarea>
                        </div>

                        <div class="form-group">
                            <label for="qualityType">Execution Quality Grade *</label>
                            <select id="qualityType" required>
                                <option value="simple">Budget Friendly (Standard Materials & Execution)</option>
                                <option value="premium" selected>Premium Finish (High-Grade Branded Materials)</option>
                                <option value="luxury">Luxury Designer (Bespoke Architectural Execution)</option>
                            </select>
                        </div>

                        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                            <button type="button" class="btn" style="background: #555; flex: 1; min-width: 100px;" onclick="goToStep(1)"><i class="fas fa-arrow-left"></i> <span>Back</span></button>
                            <button type="button" class="btn" style="flex: 2; min-width: 140px;" onclick="goToStep(3)"><span>Next: Contact Details</span> <i class="fas fa-arrow-right"></i></button>
                        </div>
                    </div>

                    <!-- STEP 3 -->
                    <div id="step-3" class="hidden">
                        <h2 class="calc-heading">Project Location & <span>Contact</span></h2>
                        <div class="form-group">
                            <label for="clientName">Full Name *</label>
                            <input type="text" id="clientName" required placeholder="Enter your full name">
                        </div>
                        <div class="form-group">
                            <label for="clientPhone">Phone Number (WhatsApp) *</label>
                            <input type="tel" id="clientPhone" required placeholder="10-digit mobile number" maxlength="10">
                        </div>
                        <div class="form-group">
                            <label for="projectLoc">Project Location / Society Name *</label>
                            <input type="text" id="projectLoc" required placeholder="e.g., Wakad, Baner, Dhayari, Pune">
                        </div>

                        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                            <button type="button" class="btn" style="background: #555; flex: 1; min-width: 100px;" onclick="goToStep(2)"><i class="fas fa-arrow-left"></i> <span>Back</span></button>
                            <button type="submit" class="btn" style="background: #25d366; flex: 2; min-width: 160px;"><i class="fas fa-calculator"></i> <span>Calculate Estimate</span></button>
                        </div>
                    </div>

                </form>

                <!-- RESULT CONTAINER -->
                <div id="resultContainer" class="hidden" style="margin-top: 25px; text-align: center;">
                    <h2 class="calc-heading">Estimated Cost <span>Breakdown</span></h2>
                    <p id="resultSubtitle" style="color: var(--gray); margin-bottom: 25px; font-size: 0.95rem;"></p>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; text-align: left;" id="tierBoxes"></div>

                    <a id="waButton" href="#" target="_blank" class="btn" style="background: #25d366; display: inline-flex; margin-top: 25px; font-size: 1.05rem; padding: 15px 30px; width: auto;">
                        <i class="fab fa-whatsapp"></i> <span>Discuss this Estimate on WhatsApp</span>
                    </a>
                </div>

            </div>
        </section>

        </main>

    

    <!-- Script Logic with Google Sheets Apps Script Integration -->
    <script>
        function toggleDrawer() {
            document.getElementById('mobileDrawer').classList.toggle('open');
        }

        function toggleService(card, serviceName) {
            card.classList.toggle('selected');
            const checkbox = card.querySelector('input[type="checkbox"]');
            checkbox.checked = !checkbox.checked;
        }

        function goToStep(stepNum) {
            if(stepNum === 2) {
                const prop = document.getElementById('propType').value;
                const carpet = document.getElementById('carpetArea').value;
                const time = document.getElementById('timeline').value;
                if(!prop || !carpet || !time) {
                    alert('Please select Property Type, enter Carpet Area, and choose Timeline.');
                    return;
                }
            }
            
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.add('hidden');
            
            document.getElementById('step-' + stepNum).classList.remove('hidden');
            window.scrollTo({top: 50, behavior: 'smooth'});
        }

        function formatLakhsRange(minVal, maxVal) {
            let minLakh = (minVal / 100000).toFixed(1);
            let maxLakh = (maxVal / 100000).toFixed(1);
            return `${minLakh} Lakhs to ${maxLakh} Lakhs`;
        }

        document.getElementById('proEstimatorForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const propType = document.getElementById('propType').value;
            const carpet = parseFloat(document.getElementById('carpetArea').value) || 600;
            const quality = document.getElementById('qualityType').value;
            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;
            const loc = document.getElementById('projectLoc').value;
            const otherReq = document.getElementById('otherService').value || 'None';

            let selectedServices = [];
            document.querySelectorAll('input[name="service"]:checked').forEach(cb => {
                selectedServices.push(cb.value);
            });

            if(selectedServices.length === 0) {
                alert('Please select at least one service.');
                goToStep(2);
                return;
            }

            let baseCost = 0;
            let ceilingCost = 0, electricalCost = 0, paintingCost = 0, furnitureCost = 0;

            if(selectedServices.includes('False Ceiling')) {
                let rate = quality === 'simple' ? 90 : (quality === 'premium' ? 180 : 230);
                ceilingCost = carpet * rate;
                baseCost += ceilingCost;
            }

            if(selectedServices.includes('Electrical')) {
                let points = 0;
                if(propType === '1 BHK') points = 35;
                else if(propType === '2 BHK') points = 50;
                else if(propType === '3 BHK') points = 70;
                else points = Math.round((carpet / 100) * 8);

                let perPointRate = quality === 'simple' ? 700 : 1100;
                electricalCost = points * perPointRate;
                baseCost += electricalCost;
            }

            if(selectedServices.includes('Painting')) {
                if(propType === '1 BHK') paintingCost = quality === 'simple' ? 30000 : (quality === 'premium' ? 42000 : 55000);
                else if(propType === '2 BHK') paintingCost = quality === 'simple' ? 45000 : (quality === 'premium' ? 58000 : 75000);
                else if(propType === '3 BHK') paintingCost = quality === 'simple' ? 60000 : (quality === 'premium' ? 78000 : 98000);
                else {
                    let rate = quality === 'simple' ? 90 : (quality === 'premium' ? 100 : 110);
                    paintingCost = carpet * rate;
                }
                baseCost += paintingCost;
            }

            if(selectedServices.includes('Furniture')) {
                if(propType === '1 BHK') furnitureCost = quality === 'simple' ? 250000 : (quality === 'premium' ? 350000 : 450000);
                else if(propType === '2 BHK') furnitureCost = quality === 'simple' ? 400000 : (quality === 'premium' ? 550000 : 700000);
                else if(propType === '3 BHK') furnitureCost = quality === 'simple' ? 550000 : (quality === 'premium' ? 780000 : 1050000);
                else {
                    let rate = quality === 'simple' ? 1400 : (quality === 'premium' ? 1600 : 1800);
                    furnitureCost = carpet * rate;
                }
                baseCost += furnitureCost;
            }

            if(baseCost === 0) baseCost = 60000;

            let simpleMin = Math.round(baseCost * 0.80);
            let simpleMax = Math.round(baseCost * 0.95);

            let premiumMin = Math.round(baseCost * 1.05);
            let premiumMax = Math.round(baseCost * 1.25);

            let luxuryMin = Math.round(baseCost * 1.40);
            let luxuryMax = Math.round(baseCost * 1.70);

            let simpleRangeStr = formatLakhsRange(simpleMin, simpleMax);
            let premiumRangeStr = formatLakhsRange(premiumMin, premiumMax);
            let luxuryRangeStr = formatLakhsRange(luxuryMin, luxuryMax);

            let servicesText = selectedServices.join(', ');
            if(otherReq && otherReq !== 'None') {
                servicesText += ' | Note: ' + otherReq;
            }

            // Google Sheets POST Payload
            const sheetPayload = {
                name: name,
                phone: phone,
                loc: loc,
                propType: propType,
                area: carpet + " sq.ft",
                services: servicesText,
                budget: `₹ ${simpleRangeStr} to ₹ ${luxuryRangeStr}`,
                timeline: document.getElementById('timeline').value
            };

            fetch("https://script.google.com/macros/s/AKfycbyfai0umT23wNzwSwsY1v8ow-qq7O4QTzuU4C9M3RKbWUtxEuK0UK65R7Ty2aoAXobOcQ/exec", {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(sheetPayload)
            }).catch(() => {});

            document.getElementById('proEstimatorForm').classList.add('hidden');
            const resultBox = document.getElementById('resultContainer');
            resultBox.classList.remove('hidden');

            document.getElementById('resultSubtitle').innerHTML = `Prepared for <b>${name}</b> (${loc}) | Property: <b>${propType} (${carpet} sq.ft)</b>`;

            document.getElementById('tierBoxes').innerHTML = `
                <div style="background: #faf9f8; padding: 18px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box;">
                    <span style="font-size: 0.7rem; font-weight: 700; color: var(--gray); text-transform: uppercase;">Standard / Basic</span>
                    <h3 style="margin: 6px 0; color: var(--dark); font-size: 1.1rem;">Budget Friendly</h3>
                    <div style="font-size: 1.15rem; font-weight: 800; color: var(--primary);">₹ ${simpleRangeStr}</div>
                    <p style="font-size: 0.75rem; color: var(--gray); margin-top: 6px;">Standard branded execution & functional layouts.</p>
                </div>
                <div style="background: #fff5f5; padding: 18px; border-radius: 10px; border: 2px solid var(--primary); position: relative; box-sizing: border-box;">
                    <span style="position: absolute; top: -9px; right: 12px; background: var(--primary); color: #fff; font-size: 0.6rem; padding: 2px 6px; border-radius: 20px; font-weight: 700;">RECOMMENDED</span>
                    <span style="font-size: 0.7rem; font-weight: 700; color: var(--primary); text-transform: uppercase;">High Grade</span>
                    <h3 style="margin: 6px 0; color: var(--dark); font-size: 1.1rem;">Premium Finish</h3>
                    <div style="font-size: 1.15rem; font-weight: 800; color: var(--primary);">₹ ${premiumRangeStr}</div>
                    <p style="font-size: 0.75rem; color: var(--gray); margin-top: 6px;">Superior boards, profile lighting & Royale paint.</p>
                </div>
                <div style="background: #faf9f8; padding: 18px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box;">
                    <span style="font-size: 0.7rem; font-weight: 700; color: var(--gray); text-transform: uppercase;">Luxury Designer</span>
                    <h3 style="margin: 6px 0; color: var(--dark); font-size: 1.1rem;">Luxury Living</h3>
                    <div style="font-size: 1.15rem; font-weight: 800; color: var(--primary);">₹ ${luxuryRangeStr}</div>
                    <p style="font-size: 0.75rem; color: var(--gray); margin-top: 6px;">Top-tier architectural elements & custom woodwork.</p>
                </div>
            `;

            const waText = encodeURIComponent(`Hello Arsh Interiors, I calculated an estimate for my ${propType} (${carpet} sq.ft) in ${loc}. Range: ₹ ${simpleRangeStr} - ₹ ${luxuryRangeStr}. My name is ${name} (${phone}).`);
            document.getElementById('waButton').href = `https://wa.me/919022104232?text=${waText}`;

            window.scrollTo({top: 50, behavior: 'smooth'});
        });
    </script>
