name: Publish queued ceiling pages

on:
  schedule:
    - cron: "15 9 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the next queued page without publishing"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: ceiling-page-publisher
  cancel-in-progress: false

jobs:
  publish-one:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published site
        uses: actions/checkout@v6
        with:
          ref: main
          path: site

      - name: Check out the unpublished page queue
        uses: actions/checkout@v6
        with:
          ref: seo-ceiling-queue
          path: queue

      - name: Prepare at most one page for today
        id: publish
        working-directory: site
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          python3 ../queue/seo-queue/publish_next.py \
            --site . \
            --queue ../queue/seo-queue \
            --dry-run "$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Commit the page to the Pages source branch
        if: steps.publish.outputs.result == 'published'
        working-directory: site
        env:
          PAGE_PATH: ${{ steps.publish.outputs.page_path }}
          PAGE_CATEGORY: ${{ steps.publish.outputs.page_category }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PAGE_PATH" "guides/index.html" "sitemap.xml" ".github/ceiling-schedule-state.json"
          if [ "$PAGE_CATEGORY" = "ceiling" ]; then
            git add -- "ceiling-services-pune/" "index.html"
          fi
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git commit -m "Publish scheduled SEO page: ${PAGE_PATH%/index.html}"
          git push origin HEAD:main

      - name: Sync the publication result to the queue manifest
        if: steps.publish.outputs.queue_changed == 'true'
        working-directory: queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "seo-queue/queue.json"
          if git diff --cached --quiet; then
            echo "Queue manifest already matches."
            exit 0
          fi
          git commit -m "Record scheduled SEO publication result"
          git push origin HEAD:seo-ceiling-queue
