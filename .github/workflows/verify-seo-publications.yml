name: Verify SEO publication queue

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish queued ceiling pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: seo-publication-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live site
        uses: actions/checkout@v6
        with:
          ref: main
          path: site

      - name: Check out the queue and publication manifest
        uses: actions/checkout@v6
        with:
          ref: seo-ceiling-queue
          path: queue
          persist-credentials: false

      - name: Verify scheduled and published pages
        run: |
          python3 .github/scripts/check_seo_publications.py \
            --site site \
            --queue queue/seo-queue
